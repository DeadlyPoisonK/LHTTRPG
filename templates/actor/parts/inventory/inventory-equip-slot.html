<div class="equip-slot {{extraClass}}{{#if locked}} locked{{/if}}" data-slot-type="{{type}}" data-slot-index="{{index}}"{{#if hand}} data-hand="{{hand}}"{{/if}}>
	{{#if swap}}<a class="hand-swap" data-action="hand-swap" data-tooltip="LHTRPG.Hands.Swap"><i class="fas fa-right-left"></i></a>{{/if}}
	{{#if item}}
		<li class="item equipped draggable" data-item-id="{{item._id}}">
			{{#if item.system.linkedSkillUuid}}
			<a class="item-control linked-skill-throw-badge" data-action="linked-skill-throw" title="{{localize 'LHTRPG.Item.Label.ThrowToChat'}}"><i class="fas fa-comment-dots"></i></a>
			{{/if}}
			<div class="item-name">
				<div class="item-control item-edit item-image" data-action="item-edit">
					<img src="{{item.img}}" title="{{item.name}}" width="48" height="48" />
				</div>
				<div class="items-control">
					<a class="item-control item-equip" data-action="item-equip" title=""><i class="fas fa-tshirt"></i></a>
					<a class="item-control item-give" data-action="item-give" data-tooltip="LHTRPG.Piles.GiveTo"><i class="fas fa-hand-holding"></i></a>
					<a class="item-control item-delete" data-action="item-delete" title=""><i class="fas fa-trash"></i></a>
				</div>
			</div>
		</li>
	{{else if locked}}
		<div class="empty-slot locked-slot" data-tooltip="{{localize 'LHTRPG.Hands.Locked' weapon=locked.name}}">
			<img class="locked-weapon" src="{{locked.img}}" alt="" height="44" width="44" />
			<i class="fas fa-lock"></i>
		</div>
	{{else}}
		<div class="empty-slot" title="{{localize typeLabel}}">
			<img class="slot-placeholder" src="systems/lhtrpg/assets/ui/items_icons/{{#if icon}}{{icon}}{{else}}{{type}}{{/if}}.svg" alt="" height="32" width="32" />
		</div>
	{{/if}}
	<span class="slot-label">{{localize typeLabel}}</span>
</div>
