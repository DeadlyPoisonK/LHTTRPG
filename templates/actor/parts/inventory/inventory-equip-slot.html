<div class="equip-slot {{extraClass}}" data-slot-type="{{type}}" data-slot-index="{{index}}">
	{{#if item}}
		<li class="item equipped" data-item-id="{{item._id}}">
			{{#if item.system.linkedSkillUuid}}
			<a class="item-control linked-skill-throw-badge" title="{{localize 'LHTRPG.Item.Label.ThrowToChat'}}"><i class="fas fa-comment-dots"></i></a>
			{{/if}}
			<div class="item-name">
				<div class="item-control item-edit item-image">
					<img src="{{item.img}}" title="{{item.name}}" width="48" height="48" />
				</div>
				<div class="items-control">
					<a class="item-control item-equip" title=""><i class="fas fa-tshirt"></i></a>
					<a class="item-control item-give" data-tooltip="LHTRPG.Piles.GiveTo"><i class="fas fa-hand-holding"></i></a>
					<a class="item-control item-delete" title=""><i class="fas fa-trash"></i></a>
				</div>
			</div>
		</li>
	{{else}}
		<div class="empty-slot" title="{{localize typeLabel}}">
			<img class="slot-placeholder" src="systems/lhtrpg/assets/ui/items_icons/{{type}}.svg" alt="" height="32" width="32" />
		</div>
	{{/if}}
	<span class="slot-label">{{localize typeLabel}}</span>
</div>
