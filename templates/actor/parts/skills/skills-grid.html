<h4 class="tab-title">
	{{toUpperCase (localize 'LHTRPG.Monster.Skills')}}
</h4>

<div class="skills-grid">
	{{#each skills as |item id|}}
		<div class="item skill-tile" data-item-id="{{item._id}}">
			<a class="item-control item-throw item-image" title="{{item.name}} — {{item.system.timing}} — {{item.system.checkLabel}}">
				<img src="{{item.img}}" width="48" height="48" />
			</a>
			<div class="items-control">
				<a class="item-control item-edit" title=""><i class="fas fa-edit"></i></a>
				<a class="item-control item-delete" title=""><i class="fas fa-trash"></i></a>
			</div>
			<span class="slot-label">{{item.name}}</span>
		</div>
	{{/each}}
	{{#if browse}}
	<a class="item skill-tile add-tile skill-browse{{#if browse.pending}} pending{{/if}}" data-subtype="{{subtype}}"
		title="{{localize 'LHTRPG.SkillBrowser.Open'}}">
		<div class="item-image add-icon"><i class="fas fa-book-open-reader"></i>
			{{#if browse.pending}}<span class="skill-pending-badge">{{browse.pending}}</span>{{/if}}</div>
		<span class="slot-label">{{localize "LHTRPG.SkillBrowser.Browse"}}</span>
	</a>
	{{/if}}
</div>
